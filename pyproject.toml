[project]
name = "ticketflow"
version = "0.1.0"
description = "Temporal.io learning project: durable support-ticket agent with human-in-the-loop approval"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
